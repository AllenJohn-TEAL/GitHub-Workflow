name: Auto Version Increment

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  update-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read Current Version
        id: current
        run: |
          VERSION=$(cat version.txt)

          IFS='.' read MAJOR MINOR BUILD REVISION <<< "$VERSION"

          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "revision=$REVISION" >> $GITHUB_OUTPUT

      - name: Calculate New Version
        id: next
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"

          MAJOR=${{ steps.current.outputs.major }}
          MINOR=${{ steps.current.outputs.minor }}
          BUILD=${{ steps.current.outputs.build }}
          REVISION=${{ steps.current.outputs.revision }}

          echo "Merged branch: $BRANCH"

          if [[ "$BRANCH" == fix/* ]]; then
            BUILD=$((BUILD + 1))
            REVISION=0

          elif [[ "$BRANCH" == hotfix/* ]]; then
            REVISION=$((REVISION + 1))

          elif [[ "$BRANCH" == feature/* ]]; then
            MINOR=$((MINOR + 1))
            BUILD=0
            REVISION=0

          elif [[ "$BRANCH" == breaking/* ]]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            BUILD=0
            REVISION=0

          else
            echo "Branch type not recognized."
            echo "Supported prefixes:"
            echo "  fix/*"
            echo "  hotfix/*"
            echo "  feature/*"
            echo "  breaking/*"
            exit 1
          fi

          NEW_VERSION="$MAJOR.$MINOR.$BUILD.$REVISION"

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New Version: $NEW_VERSION"

      - name: Update Version File
        run: |
          echo "${{ steps.next.outputs.version }}" > version.txt

      - name: Commit Version Change
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add version.txt

          git commit -m "Auto increment version to ${{ steps.next.outputs.version }}" || exit 0

          git push

      - name: Create Git Tag
        run: |
          VERSION=${{ steps.next.outputs.version }}

          git tag "v$VERSION"
          git push origin "v$VERSION"
